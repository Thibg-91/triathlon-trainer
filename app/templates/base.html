<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>{% block title %}Triathlon Trainer{% endblock %}</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="/static/js/htmx.min.js" defer></script>
</head>
<body>
  <header class="topbar">
    <h1>{% block heading %}Triathlon Trainer{% endblock %}</h1>
    {% block topbar_extra %}{% endblock %}
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <button class="fab" aria-label="Ajouter une séance"
          hx-get="/journal/form" hx-target="#dialog-body"
          hx-on::after-request="document.getElementById('log-dialog').showModal()">＋</button>

  <dialog id="log-dialog">
    <div id="dialog-body"></div>
  </dialog>

  {% set path = request.url.path %}
  <nav class="tabbar">
    <a href="/" class="{{ 'active' if path == '/' }}"><span>🏠</span>Accueil</a>
    <a href="/plan" class="{{ 'active' if path.startswith('/plan') }}"><span>🗓️</span>Plan</a>
    <a href="/journal" class="{{ 'active' if path.startswith('/journal') }}"><span>📒</span>Journal</a>
    <a href="/progress" class="{{ 'active' if path.startswith('/progress') }}"><span>📈</span>Progrès</a>
    <a href="/settings" class="{{ 'active' if path.startswith('/settings') }}"><span>⚙️</span>Réglages</a>
  </nav>

  {% block scripts %}{% endblock %}
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js").catch(() => {});
    }
  </script>
</body>
</html>
